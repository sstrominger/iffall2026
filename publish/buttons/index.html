
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Styling - Sydney Strominger</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main>

        <h1>Button Styling - Sydney Strominger</h1>

        <div class="button_container">
            <a href="https://www.spotify.com/"
                target="_blank"
                id="btn_spotify">
                    <i class="fa fa-spotify"></i>
                    Spotify
            </a>
        </div>

        <div class="button_container">
            <a href="https://www.amazon.com/"
            target="_blank"
            id="btn_amazon">
                 <i class="fa fa-cube"></i>
                Amazon
            </a>
        </div>

        <div class="button_container">
            <a href="https://www.twitter.com/"
            target="_blank"
            id="btn_twitter">
                 <i class="fa fa-twitter"></i>
                Twitter
            </a>
        </div>

        <div class="button_container">
            <a href="https://www.indiegogo.com/"
            target="_blank"
            id="btn_indiegogo">
                <i class="fa fa-lightbulb-o"></i>
                Indiegogo
            </a>
        </div>

        <!-- COCA-COLA -->
        <div class="button_container">
            <a href="https://www.coca-cola.com/"
               target="_blank"
               id="btn_cocacola">
                Coca-Cola
            </a>
        </div>

        <!-- APPLE -->
        <div class="button_container">
           <a href="https://www.apple.com/"
            target="_blank"
            id="btn_apple">
            <i class="fa fa-apple"></i>
            Apple
            </a>
        </div>

        <!-- NIKE -->
        <div class="button_container">
            <a href="https://www.nike.com/"
                target="_blank"
                id="btn_nike">
                JUST DO IT.
                <i class="fa fa-arrow-right"></i>
            </a>
        </div>

        <!-- MISSOURI BOTANICAL GARDEN -->
        <div class="button_container">
            <a href="https://www.missouribotanicalgarden.org/"
                target="_blank"
                id="btn_botanical">
                <i class="fa fa-leaf"></i>
                Missouri Botanical Garden
            </a>
        </div>

        <!-- INSTAGRAM -->
        <div class="button_container">
            <a href="https://www.instagram.com/"
                target="_blank"
                id="btn_instagram">
                <i class="fa fa-instagram"></i>
                Instagram
            </a>
        </div>

    </main>

</body>

</html>
